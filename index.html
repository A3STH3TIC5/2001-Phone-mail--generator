<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>2001年 携帯メール画面 생성기</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Kosugi+Maru&family=Shippori+Mincho&family=Yomogi&family=Reggae+One&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
  :root{
    --ink:#232323;
    --paper:#eae6dd;
    --paper-card:#f5f2ea;
    --line:#d8d2c2;
    --accent:#8a6b3f;       /* worn brass / old electronics accent */
    --accent-deep:#5f4a2c;
    --stage-bg-1:#15161a;
    --stage-bg-2:#26282f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Noto Sans KR','Noto Sans JP',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }

  .wrap{
    display:grid;
    grid-template-columns:360px 1fr;
    min-height:100vh;
  }
  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;}
  }

  /* ---------- LEFT: control panel ---------- */
  .panel{
    background:var(--paper-card);
    border-right:1px solid var(--line);
    padding:28px 24px 40px;
  }
  .brand{
    font-size:11px;
    letter-spacing:.18em;
    color:var(--accent-deep);
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:6px;
  }
  .title{
    font-size:21px;
    font-weight:700;
    line-height:1.4;
    margin:0 0 4px;
  }
  .subtitle{
    font-size:12.5px;
    color:#736c5c;
    line-height:1.6;
    margin:0 0 26px;
    border-bottom:1px dashed var(--line);
    padding-bottom:22px;
  }

  .field{margin-bottom:20px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--accent-deep);
    margin-bottom:7px;
    letter-spacing:.02em;
  }
  .field .hint{
    font-size:10.5px;
    color:#9a927e;
    font-weight:400;
    margin-left:6px;
  }
  input[type=text], textarea, select{
    width:100%;
    font-family:'Noto Sans KR',sans-serif;
    font-size:13.5px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
    resize:vertical;
  }
  textarea{min-height:150px; line-height:1.6; font-family:'Noto Sans JP',sans-serif;}
  input[type=text]:focus, textarea:focus, select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .tints{display:flex; gap:9px; margin-bottom:14px;}
  .tint{
    width:32px; height:32px; border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    position:relative;
    box-shadow:0 0 0 1px rgba(0,0,0,.1) inset;
  }
  .tint.active{border-color:var(--accent-deep);}
  .tint.active::after{
    content:"✓"; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; font-size:13px;
    color:rgba(0,0,0,.55);
  }

  .colorgrid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .colorfield{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px 8px 6px 10px;
    background:#fff;
  }
  .colorfield span{font-size:11.5px; color:#5c5544;}
  .colorfield input[type=color]{
    width:28px; height:28px; padding:0; border:1px solid var(--line);
    border-radius:4px; cursor:pointer; background:none;
  }

  .toggles{display:flex; flex-direction:column; gap:8px;}
  .toggle-row{
    display:flex; align-items:center; gap:9px; font-size:13px;
  }
  .toggle-row input{width:16px; height:16px;}

  .dl-btn{
    width:100%;
    margin-top:8px;
    padding:13px 14px;
    border:none;
    border-radius:3px;
    background:var(--accent-deep);
    color:#f5f1e6;
    font-size:14px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .15s ease;
  }
  .dl-btn:hover{background:#4a3a22;}
  .dl-note{
    font-size:11px; color:#9a927e; margin-top:9px; line-height:1.6;
  }

  /* ---------- RIGHT: stage ---------- */
  .stage{
    background:
      radial-gradient(ellipse at 50% 20%, var(--stage-bg-2), var(--stage-bg-1) 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 24px;
    position:relative;
    overflow:auto;
  }
  .stage::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:3px 3px;
    pointer-events:none;
  }

  /* ---------- Screen mockup ---------- */
  #phoneCapture{
    --capture-padding:40px;
    padding:var(--capture-padding);
    position:relative;
  }
  #phoneCapture.show-bounds{
    outline:1px dashed rgba(255,255,255,.4);
    outline-offset:-1px;
  }
  #phoneCapture.bg-checker{
    background-image:
      repeating-conic-gradient(#3a3c42 0% 25%, #2b2d32 0% 50%);
    background-size:16px 16px;
  }
  .drop-shadow-canvas{
    position:absolute;
    left:0; top:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
  }
  .screen-bezel{
    position:relative;
    z-index:1;
    width:250px;
    background:#0b0c0e;
    border-radius:14px;
    padding:10px;
    box-shadow:
      0 2px 0 rgba(255,255,255,.08) inset,
      0 0 0 1px rgba(255,255,255,.06);
  }
  .screen-bezel.with-drop-shadow{
    box-shadow:
      0 24px 50px rgba(0,0,0,.55),
      0 2px 0 rgba(255,255,255,.08) inset,
      0 0 0 1px rgba(255,255,255,.06);
  }
  .screen{
    --scr-bg:#eef0e4;
    --scr-fg:#1c1e16;
    --scr-title-bg:#2b4066;
    --scr-title-fg:#f4f6ff;
    --scr-status-bg:#dfe3d3;
    --scr-status-border:#c7cbb9;
    --scr-soft-bg:#c9cdba;
    --scr-soft-border:#b7bba5;
    --scr-font:'DotGothic16','Noto Sans JP',sans-serif;
    position:relative;
    background:var(--scr-bg);
    border-radius:0;
    overflow:hidden;
    font-family:var(--scr-font);
    color:var(--scr-fg);
    box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
  }

  .lcd-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
    display:block;
    border-radius:0;
  }

  .s-status{
    position:relative;
    background:var(--scr-status-bg);
    padding:3px 6px;
    min-height:11px;
    font-size:9px;
    color:var(--scr-fg);
    border-bottom:1px solid var(--scr-status-border);
  }
  .status-icons{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    display:block;
    color:var(--scr-fg);
  }

  .s-carrier{
    font-size:10px; font-weight:700; letter-spacing:.03em;
    padding:3px 6px 2px;
    color:var(--scr-fg);
  }

  .s-title{
    display:flex; align-items:center; gap:6px;
    background:var(--scr-title-bg);
    color:var(--scr-title-fg);
    padding:5px 7px;
    font-size:12px;
  }
  .s-title .mark{
    background:var(--scr-title-fg); color:var(--scr-title-bg); font-weight:700;
    font-size:10px; padding:0 4px; border-radius:2px;
  }
  .s-title .ttl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700;}
  .s-title .pg{font-size:10px; opacity:.85; white-space:nowrap;}

  .s-body{
    padding:9px 8px 10px;
    font-size:12.5px;
    line-height:1.85;
    min-height:150px;
    white-space:pre-wrap;
    word-break:break-word;
    background:var(--scr-bg);
  }

  .s-soft{
    position:relative;
    background:var(--scr-soft-bg);
    border-top:1px solid var(--scr-soft-border);
    font-size:9.5px;
    min-height:11px;
    padding:4px 6px;
    color:var(--scr-fg);
  }
  .soft-left{ display:inline-block; }
  .soft-left .key{ display:inline-block; vertical-align:middle; }
  .soft-center{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
  }
  .soft-right-key{
    position:absolute; right:6px; top:50%;
    transform:translateY(-50%);
  }
  .s-soft .key{
    display:inline-block; width:11px; height:11px; border-radius:2px;
    background:var(--scr-fg); color:var(--scr-bg); font-size:8px; line-height:11px; text-align:center;
  }

  footer{
    text-align:center; color:#5c6270; font-size:10.5px; padding:10px 0 26px;
    letter-spacing:.02em;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ CONTROL PANEL ============ -->
  <div class="panel">
    <div class="brand">au by KDDI — 2001</div>
    <h1 class="title">휴대폰 메일 화면<br>생성기</h1>
    <p class="subtitle">2001年頃 일본 피처폰의 메일/소설 화면만 재현합니다. 값을 입력하면 오른쪽 화면이 바로 바뀝니다.</p>

    <div class="field">
      <label>화면 색감 <span class="hint">프리셋</span></label>
      <div class="tints">
        <div class="tint active" data-tint="green"  style="background:#eef0e4" data-bg="#eef0e4" data-fg="#1c1e16" data-title="#2b4066" data-titlefg="#f4f6ff"></div>
        <div class="tint" data-tint="blue"   style="background:#dce8f2" data-bg="#dce8f2" data-fg="#122031" data-title="#12385e" data-titlefg="#eaf4ff"></div>
        <div class="tint" data-tint="amber"  style="background:#2a1a06" data-bg="#2a1a06" data-fg="#ffb238" data-title="#4a2c07" data-titlefg="#ffd27a"></div>
        <div class="tint" data-tint="white"  style="background:#ffffff" data-bg="#ffffff" data-fg="#111111" data-title="#111111" data-titlefg="#ffffff"></div>
        <div class="tint" data-tint="pink"   style="background:#fbe3ea" data-bg="#fbe3ea" data-fg="#5a1f34" data-title="#b4527a" data-titlefg="#fff2f6"></div>
      </div>
      <div class="colorgrid">
        <label class="colorfield"><span>배경색</span><input type="color" id="colBg" value="#eef0e4"></label>
        <label class="colorfield"><span>글자색</span><input type="color" id="colFg" value="#1c1e16"></label>
        <label class="colorfield"><span>타이틀바</span><input type="color" id="colTitleBg" value="#2b4066"></label>
        <label class="colorfield"><span>타이틀 글자</span><input type="color" id="colTitleFg" value="#f4f6ff"></label>
      </div>
    </div>

    <div class="field">
      <label>LCD 화면 효과</label>
      <div class="toggle-row">
        <input type="checkbox" id="lcdToggle" checked>
        <span>스캔라인 / 유리 반사 / 비네트 효과 사용</span>
      </div>
      <div style="margin-top:10px;">
        <input type="range" id="lcdIntensity" min="0" max="100" value="45" style="width:100%;">
      </div>
    </div>

    <div class="field">
      <label>폰트</label>
      <select id="fontSelect">
        <option value="'DotGothic16','Noto Sans JP',sans-serif" selected>도트고딕 (일본, 구형 LCD 느낌)</option>
        <option value="'Galmuri11','Galmuri9',monospace">갈무리11 (한국 도트고딕)</option>
        <option value="'Galmuri9','Galmuri11',monospace">갈무리9 (한국 도트고딕, 더 작게)</option>
        <option value="'Galmuri14','Galmuri11',monospace">갈무리14 (한국 도트고딕, 더 크게)</option>
        <option value="'Noto Sans JP',sans-serif">Noto Sans JP (모던 고딕)</option>
        <option value="'Kosugi Maru','Noto Sans JP',sans-serif">Kosugi Maru (둥근 고딕)</option>
        <option value="'Shippori Mincho',serif">Shippori Mincho (명조체)</option>
        <option value="'Yomogi',cursive">Yomogi (손글씨)</option>
        <option value="'Reggae One',cursive">Reggae One (굵은 팝체)</option>
      </select>
    </div>

    <div class="field">
      <label>통신사 표시</label>
      <input type="text" id="carrier" value="au by KDDI" maxlength="20">
    </div>

    <div class="field row2">
      <div>
        <label>제목</label>
        <input type="text" id="title" value="悪夢療法" maxlength="16">
      </div>
      <div>
        <label>페이지 <span class="hint">예: 1/4</span></label>
        <input type="text" id="page" value="(1/4)" maxlength="8">
      </div>
    </div>

    <div class="field">
      <label>본문 내용</label>
      <textarea id="body">いつも半端にサンダルという格好の男が、今夜はスーツにマフラー姿で店に入って来た。ラックの帽子を整理していた仕事中の私は、手を休めてその男の顔を確かめた。深く被った帽子のせいで顔がよく分かるのが日頃の女の客だといつも、私の心の中では小さく舌を巻いた。しかし</textarea>
    </div>

    <div class="field row2">
      <div>
        <label>왼쪽 소프트키</label>
        <input type="text" id="softLeft" value="戻る" maxlength="6">
      </div>
      <div>
        <label>오른쪽 소프트키</label>
        <input type="text" id="softRight" value="メニュー" maxlength="6">
      </div>
    </div>

    <div class="field">
      <label>시간 표시</label>
      <input type="text" id="clock" value="19:24" maxlength="6">
    </div>

    <div class="field">
      <label>여백 <span class="hint">저장 시 화면 주위 여백</span></label>
      <input type="range" id="marginSize" min="0" max="120" value="40" style="width:100%;">
    </div>

    <div class="field">
      <label>입체 그림자</label>
      <div class="toggle-row">
        <input type="checkbox" id="shadowToggle" checked>
        <span>휴대폰 아래에 그림자 표시 (저장 시에도 포함)</span>
      </div>
    </div>

    <div class="field">
      <label>배경</label>
      <div class="toggle-row">
        <input type="checkbox" id="bgTransparent">
        <span>투명 배경으로 저장</span>
      </div>
      <div class="colorfield" style="margin-top:10px;">
        <span>배경색</span>
        <input type="color" id="bgColor" value="#1a1c20">
      </div>
    </div>

    <button class="dl-btn" id="downloadBtn">화면 이미지로 저장 (PNG)</button>
    <div class="dl-note">여백과 배경 설정을 포함해 PNG로 저장됩니다.</div>
  </div>

  <!-- ============ STAGE / PREVIEW (pure Canvas 2D — no DOM-to-image conversion) ============ -->
  <div class="stage">
    <canvas id="mockupCanvas"></canvas>
  </div>
</div>

<footer>이 페이지는 2001년경 일본 피처폰 메일/케이타이 소설 화면 감성을 재현하기 위한 팬 제작 목업입니다.</footer>

<script>
  const $ = id => document.getElementById(id);
  const canvas = document.getElementById('mockupCanvas');
  const ctx = canvas.getContext('2d');
  const RENDER_SCALE = 3; // internal resolution multiplier — this IS the exported resolution, live preview and download are the exact same pixels

  // ---------- layout constants (logical / CSS-like px) ----------
  const BEZEL_RADIUS = 14;
  const BEZEL_PAD = 10;
  const SCREEN_W = 230;
  const STATUS_H = 18, CARRIER_H = 20, TITLE_H = 30, SOFT_H = 20;
  const BODY_PAD_TOP = 9, BODY_PAD_BOTTOM = 10, BODY_PAD_X = 8;
  const BODY_FONT_SIZE = 12.5, BODY_LINE_HEIGHT = 23, BODY_MIN_HEIGHT = 150;

  function shade(hex, amt){
    const c = hex.replace('#','');
    const n = parseInt(c.length===3 ? c.split('').map(ch=>ch+ch).join('') : c, 16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.round(r*(1-amt)); g=Math.round(g*(1-amt)); b=Math.round(b*(1-amt));
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function roundRectPath(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }
  function primaryFontName(stack){
    const m = stack.match(/'([^']+)'/);
    return m ? m[1] : stack.split(',')[0].trim();
  }
  function wrapText(c, text, maxWidth){
    const paragraphs = text.split('\n');
    const lines = [];
    for (const para of paragraphs){
      if (para.length === 0){ lines.push(''); continue; }
      let line = '';
      for (const ch of para){
        const test = line + ch;
        if (c.measureText(test).width > maxWidth && line.length > 0){
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      lines.push(line);
    }
    return lines;
  }
  function truncateToWidth(c, text, maxWidth){
    if (c.measureText(text).width <= maxWidth) return text;
    let t = text;
    while (t.length > 0 && c.measureText(t + '…').width > maxWidth){ t = t.slice(0, -1); }
    return t + '…';
  }

  function paintLcdEffect(c, w, h, intensity){
    c.save();
    c.fillStyle = `rgba(0,0,0,${0.18*intensity})`;
    for(let sy = 0; sy < h; sy += 2){ c.fillRect(0, sy, w, 1); }
    c.fillStyle = `rgba(0,0,0,${0.07*intensity})`;
    for(let sx = 0; sx < w; sx += 2){ c.fillRect(sx, 0, 1, h); }
    const glare = c.createLinearGradient(0, 0, w*0.6, h*0.4);
    glare.addColorStop(0,    `rgba(255,255,255,${0.14*intensity})`);
    glare.addColorStop(0.25, `rgba(255,255,255,${0.05*intensity})`);
    glare.addColorStop(0.5,  `rgba(255,255,255,0)`);
    glare.addColorStop(1,    `rgba(255,255,255,0)`);
    c.fillStyle = glare;
    c.fillRect(0, 0, w, h);
    const cx = w/2, cy = h/2;
    const maxR = Math.sqrt(cx*cx + cy*cy);
    const vig = c.createRadialGradient(cx, cy, maxR*0.55, cx, cy, maxR);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, `rgba(0,0,0,${0.45*intensity})`);
    c.fillStyle = vig;
    c.fillRect(0, 0, w, h);
    c.restore();
  }

  function drawStatusIcons(c, x, y, fg){
    c.save();
    c.fillStyle = fg;
    c.fillRect(x+0, y+7, 2, 3);
    c.fillRect(x+3, y+5, 2, 5);
    c.fillRect(x+6, y+3, 2, 7);
    c.fillRect(x+9, y+0, 2, 10);
    c.strokeStyle = fg;
    c.lineWidth = 1;
    roundRectPath(c, x+17, y+1, 16, 8, 1);
    c.stroke();
    c.fillRect(x+18.5, y+2.5, 10, 5);
    c.fillRect(x+34, y+3.5, 1.5, 3);
    c.restore();
  }

  let fontsReady = false;

  async function preloadFonts(){
    const names = [...new Set(Array.from(document.querySelectorAll('#fontSelect option')).map(o => primaryFontName(o.value)))];
    try{
      await Promise.all(names.flatMap(name => [
        document.fonts.load(`400 14px "${name}"`),
        document.fonts.load(`700 14px "${name}"`)
      ]));
      await document.fonts.ready;
    }catch(e){ console.warn('font preload issue', e); }
    fontsReady = true;
    render();
  }

  function render(forExport){
    const fontStack = $('fontSelect').value;
    const bg = $('colBg').value;
    const fg = $('colFg').value;
    const titleBg = $('colTitleBg').value;
    const titleFg = $('colTitleFg').value;
    const statusBg = shade(bg, 0.15);
    const statusBorder = shade(bg, 0.35);
    const softBg = shade(bg, 0.22);
    const softBorder = shade(bg, 0.40);

    const clock = $('clock').value || '';
    const carrier = $('carrier').value || 'au by KDDI';
    const title = $('title').value || '';
    const page = $('page').value || '';
    const bodyText = $('body').value || '';
    const softLeft = $('softLeft').value || '戻る';
    const softRight = $('softRight').value || 'メニュー';

    // measure body wrapping using the real font
    ctx.font = `${BODY_FONT_SIZE}px ${fontStack}`;
    const lines = wrapText(ctx, bodyText, SCREEN_W - BODY_PAD_X*2);
    const bodyContentH = lines.length * BODY_LINE_HEIGHT;
    const bodyH = Math.max(BODY_MIN_HEIGHT, bodyContentH + BODY_PAD_TOP + BODY_PAD_BOTTOM);

    const screenH = STATUS_H + CARRIER_H + TITLE_H + bodyH + SOFT_H;
    const bezelW = SCREEN_W + BEZEL_PAD*2;
    const bezelH = BEZEL_PAD*2 + screenH;
    const margin = parseInt($('marginSize').value, 10);
    const totalW = bezelW + margin*2;
    const totalH = bezelH + margin*2;

    canvas.width = totalW * RENDER_SCALE;
    canvas.height = totalH * RENDER_SCALE;
    canvas.style.width = totalW + 'px';
    canvas.style.height = totalH + 'px';
    ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);
    ctx.clearRect(0, 0, totalW, totalH);

    const transparent = $('bgTransparent').checked;
    if (!transparent){
      ctx.fillStyle = $('bgColor').value;
      ctx.fillRect(0, 0, totalW, totalH);
    } else if (!forExport){
      const cell = 16;
      for (let cy = 0; cy < totalH; cy += cell){
        for (let cx = 0; cx < totalW; cx += cell){
          const odd = ((cx/cell)|0 + (cy/cell)|0) % 2;
          ctx.fillStyle = odd ? '#2b2d32' : '#3a3c42';
          ctx.fillRect(cx, cy, cell, cell);
        }
      }
    }

    const bx = margin, by = margin;

    // drop shadow (drawn before the bezel so it sits behind it)
    if ($('shadowToggle').checked){
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 34;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 18;
      ctx.fillStyle = '#0b0c0e';
      roundRectPath(ctx, bx, by, bezelW, bezelH, BEZEL_RADIUS);
      ctx.fill();
      ctx.restore();
    }

    // bezel
    ctx.save();
    ctx.fillStyle = '#0b0c0e';
    roundRectPath(ctx, bx, by, bezelW, bezelH, BEZEL_RADIUS);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    roundRectPath(ctx, bx+0.5, by+0.5, bezelW-1, bezelH-1, BEZEL_RADIUS);
    ctx.stroke();
    ctx.restore();

    const sx = bx + BEZEL_PAD, sy = by + BEZEL_PAD;
    let rowY = sy;

    // status bar
    ctx.fillStyle = statusBg;
    ctx.fillRect(sx, rowY, SCREEN_W, STATUS_H);
    ctx.strokeStyle = statusBorder;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, rowY+STATUS_H-0.5); ctx.lineTo(sx+SCREEN_W, rowY+STATUS_H-0.5); ctx.stroke();
    ctx.fillStyle = fg;
    ctx.font = `${9 * (2/3)}px ${fontStack}`; // ~9px visual size to match original design
    ctx.font = `9px ${fontStack}`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(clock, sx+6, rowY + STATUS_H/2 + 1);
    drawStatusIcons(ctx, sx + SCREEN_W - 6 - 36, rowY + (STATUS_H-10)/2, fg);
    rowY += STATUS_H;

    // carrier bar
    ctx.fillStyle = bg;
    ctx.fillRect(sx, rowY, SCREEN_W, CARRIER_H);
    ctx.fillStyle = fg;
    ctx.font = `bold 10px ${fontStack}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(carrier, sx+6, rowY + CARRIER_H/2 + 1);
    rowY += CARRIER_H;

    // title bar
    ctx.fillStyle = titleBg;
    ctx.fillRect(sx, rowY, SCREEN_W, TITLE_H);
    const badgeX = sx+7, badgeY = rowY + (TITLE_H-16)/2, badgeW = 18, badgeH = 16;
    ctx.fillStyle = titleFg;
    roundRectPath(ctx, badgeX, badgeY, badgeW, badgeH, 2);
    ctx.fill();
    ctx.fillStyle = titleBg;
    ctx.font = `bold 10px ${fontStack}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('B', badgeX+badgeW/2, badgeY+badgeH/2+1);

    ctx.font = `bold 12px ${fontStack}`;
    ctx.textAlign = 'right';
    ctx.fillStyle = titleFg;
    const pageX = sx + SCREEN_W - 7;
    ctx.font = `10px ${fontStack}`;
    ctx.globalAlpha = 0.85;
    ctx.fillText(page, pageX, rowY + TITLE_H/2 + 1);
    ctx.globalAlpha = 1;
    const pageW = ctx.measureText(page).width;

    ctx.font = `bold 12px ${fontStack}`;
    ctx.textAlign = 'left';
    const titleX = badgeX + badgeW + 6;
    const titleMaxW = (pageX - pageW - 8) - titleX;
    const titleShown = truncateToWidth(ctx, title, Math.max(10, titleMaxW));
    ctx.fillText(titleShown, titleX, rowY + TITLE_H/2 + 1);
    rowY += TITLE_H;

    // body
    ctx.fillStyle = bg;
    ctx.fillRect(sx, rowY, SCREEN_W, bodyH);
    ctx.fillStyle = fg;
    ctx.font = `${BODY_FONT_SIZE}px ${fontStack}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    let ly = rowY + BODY_PAD_TOP + BODY_FONT_SIZE;
    for (const line of lines){
      ctx.fillText(line, sx + BODY_PAD_X, ly);
      ly += BODY_LINE_HEIGHT;
    }
    rowY += bodyH;

    // soft key bar
    ctx.fillStyle = softBg;
    ctx.fillRect(sx, rowY, SCREEN_W, SOFT_H);
    ctx.strokeStyle = softBorder;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, rowY+0.5); ctx.lineTo(sx+SCREEN_W, rowY+0.5); ctx.stroke();

    ctx.font = `9.5px ${fontStack}`;
    ctx.textBaseline = 'middle';
    const keyY = rowY + SOFT_H/2;
    // left key + label
    ctx.fillStyle = fg;
    roundRectPath(ctx, sx+6, keyY-5.5, 11, 11, 2);
    ctx.fill();
    ctx.fillStyle = bg;
    ctx.font = `8px ${fontStack}`;
    ctx.textAlign = 'center';
    ctx.fillText('◀', sx+6+5.5, keyY+1);
    ctx.fillStyle = fg;
    ctx.font = `9.5px ${fontStack}`;
    ctx.textAlign = 'left';
    ctx.fillText(softLeft, sx+6+11+3, keyY+1);
    // center label
    ctx.textAlign = 'center';
    ctx.fillText(softRight, sx+SCREEN_W/2, keyY+1);
    // right key
    ctx.fillStyle = fg;
    roundRectPath(ctx, sx+SCREEN_W-6-11, keyY-5.5, 11, 11, 2);
    ctx.fill();
    ctx.fillStyle = bg;
    ctx.font = `8px ${fontStack}`;
    ctx.textAlign = 'center';
    ctx.fillText('▶', sx+SCREEN_W-6-5.5, keyY+1);

    // LCD overlay, on top of the whole screen area only
    if ($('lcdToggle').checked){
      ctx.save();
      ctx.translate(sx, sy);
      paintLcdEffect(ctx, SCREEN_W, screenH, $('lcdIntensity').value/100);
      ctx.restore();
    }

    // crop-bounds indicator (preview only, never in the exported file)
    if (!forExport){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4,3]);
      ctx.strokeRect(0.5, 0.5, totalW-1, totalH-1);
      ctx.restore();
    }
  }

  // ---- tint presets ----
  document.querySelectorAll('.tint').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tint').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      $('colBg').value = t.dataset.bg;
      $('colFg').value = t.dataset.fg;
      $('colTitleBg').value = t.dataset.title;
      $('colTitleFg').value = t.dataset.titlefg;
      render();
    });
  });
  ['colBg','colFg','colTitleBg','colTitleFg'].forEach(id=>{
    $(id).addEventListener('input', ()=>{
      document.querySelectorAll('.tint').forEach(t=>t.classList.remove('active'));
      render();
    });
  });

  // ---- background controls ----
  function syncBgToggle(){
    $('bgColor').disabled = $('bgTransparent').checked;
  }
  $('bgTransparent').addEventListener('change', ()=>{ syncBgToggle(); render(); });
  $('bgColor').addEventListener('input', ()=>{
    $('bgTransparent').checked = false;
    syncBgToggle();
    render();
  });
  syncBgToggle();

  // ---- everything else that should trigger a re-render ----
  ['carrier','title','page','body','softLeft','softRight','clock','marginSize','lcdIntensity'].forEach(id=>{
    $(id).addEventListener('input', ()=>render());
  });
  ['lcdToggle','shadowToggle','fontSelect'].forEach(id=>{
    $(id).addEventListener('change', ()=>render());
  });

  render(); // draw immediately with fallback fonts
  preloadFonts(); // then again once the real webfonts are ready

  $('downloadBtn').addEventListener('click', ()=>{
    const btn = $('downloadBtn');
    const originalLabel = btn.textContent;
    try{
      render(true); // forExport: skip checkerboard preview + dashed bounds indicator
      const link = document.createElement('a');
      link.download = 'keitai-mail-2001.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(err){
      console.error('PNG export failed:', err);
      alert('이미지 저장 중 오류가 발생했어요: ' + err.message);
    }finally{
      render(false); // restore live-preview decorations
    }
  });
</script>

</body>
</html>
